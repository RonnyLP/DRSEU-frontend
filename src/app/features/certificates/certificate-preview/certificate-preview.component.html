<mat-toolbar color="primary" style="justify-content: space-between;">
  <div class="flex-row">
    <a mat-icon-button [routerLink]="['/certificates', certId()]" aria-label="Volver a ficha">
      <mat-icon>arrow_back</mat-icon>
    </a>
    <span>Vista previa — Certificado</span>
  </div>
  <button mat-stroked-button style="color: white; border-color: white;">
    <mat-icon>download</mat-icon>
    Descargar PDF
  </button>
</mat-toolbar>

<div class="preview-container">
  <div class="preview-frame">
    <div style="text-align: center; color: #9e9e9e;">
      <mat-icon style="font-size: 64px; width: 64px; height: 64px; color: #bdbdbd;">picture_as_pdf</mat-icon>
      <p>Vista previa del certificado PDF</p>
      <p style="font-size: 12px;">(Requiere integración con pdfjs-dist)</p>
    </div>
  </div>
</div>
