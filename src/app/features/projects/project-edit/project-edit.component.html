<div class="page-header">
  <h1 class="page-title">Editar proyecto</h1>
  <a mat-button [routerLink]="['/projects', projectId()]">
    <mat-icon>arrow_back</mat-icon>
    Volver al detalle
  </a>
</div>

<mat-card style="max-width: 720px;">
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-section">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre del proyecto</mat-label>
        <input matInput formControlName="name">
        @if (form.controls.name.hasError('required') && form.controls.name.touched) {
          <mat-error>El nombre es requerido</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descripción</mat-label>
        <textarea matInput formControlName="description" rows="3"></textarea>
      </mat-form-field>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Fecha de inicio</mat-label>
          <input matInput [matDatepicker]="startPicker" formControlName="startDate">
          <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Fecha de fin</mat-label>
          <input matInput [matDatepicker]="endPicker" formControlName="endDate">
          <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" style="max-width: 240px;">
        <mat-label>Estado</mat-label>
        <mat-select formControlName="status">
          <mat-option value="draft">Borrador</mat-option>
          <mat-option value="active">Activo</mat-option>
          <mat-option value="closed">Cerrado</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="form-actions">
        <a mat-button [routerLink]="['/projects', projectId()]">Cancelar</a>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
          <mat-icon>save</mat-icon>
          Guardar cambios
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
