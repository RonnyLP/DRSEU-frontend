<div class="page-header">
  <h1 class="page-title">Solicitudes de Emisión</h1>
</div>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="requests()" class="full-width">

      <ng-container matColumnDef="project">
        <th mat-header-cell *matHeaderCellDef>Proyecto</th>
        <td mat-cell *matCellDef="let row" style="font-weight: 500;">{{ row.projectName }}</td>
      </ng-container>

      <ng-container matColumnDef="mode">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let row">{{ modeLabel(row.mode) }}</td>
      </ng-container>

      <ng-container matColumnDef="participantCount">
        <th mat-header-cell *matHeaderCellDef>Participantes</th>
        <td mat-cell *matCellDef="let row">{{ row.participantCount }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let row">
          <span [class]="'status-badge status-' + row.status">{{ statusLabel(row.status) }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Creado</th>
        <td mat-cell *matCellDef="let row">{{ row.createdAt }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row" class="actions-cell">
          <a mat-icon-button [routerLink]="['/issuance-requests', row.id]" matTooltip="Ver detalle">
            <mat-icon>visibility</mat-icon>
          </a>
          @if (row.status === 'completed') {
            <button mat-icon-button matTooltip="Descargar ZIP">
              <mat-icon>download</mat-icon>
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
  </mat-card-content>
</mat-card>
