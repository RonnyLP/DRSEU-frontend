<div class="page-header">
  <h1 class="page-title">Tipos de Certificado</h1>
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Nuevo tipo
  </button>
</div>

<mat-card>
  <mat-card-content>
    @if (loading()) {
      <p style="padding: 24px; text-align: center; color: #757575;">Cargando...</p>
    } @else if (certificateTypes().length === 0) {
      <p style="padding: 24px; text-align: center; color: #757575;">
        No hay tipos de certificado registrados.
      </p>
    } @else {
      <table mat-table [dataSource]="certificateTypes()" class="full-width">

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let row" style="font-weight: 500;">{{ row.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let row" class="text-secondary">{{ row.descripcion }}</td>
        </ng-container>

        <ng-container matColumnDef="predeterminado">
          <th mat-header-cell *matHeaderCellDef>Predeterminado</th>
          <td mat-cell *matCellDef="let row">
            @if (row.esPredeterminado) {
              <mat-icon style="color: #1976d2; font-size: 20px;">check_circle</mat-icon>
            }
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row" class="actions-cell">
            <button mat-icon-button matTooltip="Editar" (click)="openEdit(row)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Eliminar" style="color: #b71c1c;" (click)="confirmDelete(row)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    }
  </mat-card-content>
</mat-card>
