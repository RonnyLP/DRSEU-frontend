<div class="page-header">
  <div class="flex-row">
    <a mat-icon-button [routerLink]="['/projects', projectId()]" aria-label="Volver al proyecto">
      <mat-icon>arrow_back</mat-icon>
    </a>
    <h1 class="page-title">Participantes</h1>
  </div>
  <div class="flex-row gap-8">
    <button mat-button>
      <mat-icon>upload</mat-icon>
      Carga masiva
    </button>
    <button mat-flat-button color="primary">
      <mat-icon>person_add</mat-icon>
      Añadir participante
    </button>
  </div>
</div>

<mat-card class="filter-card">
  <mat-card-content>
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar participante</mat-label>
      <input matInput [formControl]="searchControl" placeholder="Nombre, DNI o correo...">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="participants()" class="full-width">

      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox aria-label="Seleccionar todos"></mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox [aria-label]="'Seleccionar ' + row.fullName"></mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef>Nombre completo</th>
        <td mat-cell *matCellDef="let row" style="font-weight: 500;">{{ row.fullName }}</td>
      </ng-container>

      <ng-container matColumnDef="dni">
        <th mat-header-cell *matHeaderCellDef>DNI</th>
        <td mat-cell *matCellDef="let row">{{ row.dni }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Correo</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>

      <ng-container matColumnDef="participationType">
        <th mat-header-cell *matHeaderCellDef>Tipo de participación</th>
        <td mat-cell *matCellDef="let row">
          <span class="status-badge status-active" style="background: #e3f2fd; color: #0d47a1;">{{ row.participationType }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row" class="actions-cell">
          <a mat-icon-button [routerLink]="[row.id, 'edit']" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button matTooltip="Eliminar" style="color: #b71c1c;">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
  </mat-card-content>
</mat-card>
